services:
  kme-a:
    build:
      context: .
      dockerfile: Dockerfile.kme
    ports:
      - "8001:8000"
    environment:
      KME_ID: KME_A
      KME_PEERS: '{"SAE_B": "http://kme-b:8000", "SAE_C": "http://kme-c:8000"}'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/keys/SAE_A/status', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  kme-b:
    build:
      context: .
      dockerfile: Dockerfile.kme
    ports:
      - "8002:8000"
    environment:
      KME_ID: KME_B
      KME_PEERS: '{"SAE_A": "http://kme-a:8000", "SAE_C": "http://kme-c:8000"}'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/keys/SAE_B/status', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  kme-c:
    build:
      context: .
      dockerfile: Dockerfile.kme
    ports:
      - "8003:8000"
    environment:
      KME_ID: KME_C
      KME_PEERS: '{"SAE_A": "http://kme-a:8000", "SAE_B": "http://kme-b:8000"}'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/keys/SAE_C/status', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  sae-a:
    build:
      context: .
      dockerfile: Dockerfile.sae
    depends_on:
      kme-a:
        condition: service_healthy
    environment:
      KME_URL: http://kme-a:8000
      SAE_ID: SAE_A
    command: ["sleep", "infinity"]

  sae-b:
    build:
      context: .
      dockerfile: Dockerfile.sae
    depends_on:
      kme-b:
        condition: service_healthy
    environment:
      KME_URL: http://kme-b:8000
      SAE_ID: SAE_B
    command: ["sleep", "infinity"]

  sae-c:
    build:
      context: .
      dockerfile: Dockerfile.sae
    depends_on:
      kme-c:
        condition: service_healthy
    environment:
      KME_URL: http://kme-c:8000
      SAE_ID: SAE_C
    command: ["sleep", "infinity"]
