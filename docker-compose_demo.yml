# Démo hybride à 2 sites (Figure 2 ETSI + 4 points de img_scheme).
# SAE_A (maître) et SAE_B (esclave) :
#   1) clé QKD via leurs KME       2) PQC ML-KEM-768 + notif key_ID
#   3) clé = PQC XOR QKD           4) tunnel WireGuard (PSK = clé hybride)
# Le canal classique (key_ID, clés publiques PQC/WG, ciphertext) passe par le
# volume partagé `chan`. Le PSK n'y transite jamais.
#
# Authentification :
#   - SAE<->KME : mTLS classique (CA EC P-256, `./certs/tls`, aucune dépendance
#     PQC) — le KME externe (port 8000) exige un certificat client valide.
#   - SAE<->SAE (canal classique) : chaque message est signé ML-DSA-65
#     (CRYSTALS-Dilithium) et vérifié contre le certificat d'identité du pair
#     (`./certs/pqc`).
#   - KME<->KME (port interne 8001, réplication) : HTTP en clair, inchangé,
#     hors périmètre de cette authentification.
# `pki-init` génère les deux PKI une fois, avant tout le reste.
services:
  pki-init:
    build: {context: ., dockerfile: Dockerfile.sae}
    entrypoint: ["python", "pki_setup.py"]
    command: ["A", "B"]
    volumes: ["./certs:/certs"]

  kme-a:
    build: {context: ., dockerfile: Dockerfile.kme}
    ports: ["8001:8000"]
    depends_on:
      pki-init: {condition: service_completed_successfully}
    environment:
      KME_ID: KME_A
      KME_PEERS: '{"SAE_B": "http://kme-b:8001"}'
      KME_INTERNAL_PORT: "8001"
      TLS_SERVER_CERT: /certs/server.crt
      TLS_SERVER_KEY: /certs/server.key
      TLS_CA_CERT: /certs/ca.crt
    volumes:
      - ./certs/tls/kme_a.crt:/certs/server.crt:ro
      - ./certs/tls/kme_a.key:/certs/server.key:ro
      - ./certs/tls/ca.crt:/certs/ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  kme-b:
    build: {context: ., dockerfile: Dockerfile.kme}
    ports: ["8002:8000"]
    depends_on:
      pki-init: {condition: service_completed_successfully}
    environment:
      KME_ID: KME_B
      KME_PEERS: '{"SAE_A": "http://kme-a:8001"}'
      KME_INTERNAL_PORT: "8001"
      TLS_SERVER_CERT: /certs/server.crt
      TLS_SERVER_KEY: /certs/server.key
      TLS_CA_CERT: /certs/ca.crt
    volumes:
      - ./certs/tls/kme_b.crt:/certs/server.crt:ro
      - ./certs/tls/kme_b.key:/certs/server.key:ro
      - ./certs/tls/ca.crt:/certs/ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10

  sae-a:
    build: {context: ., dockerfile: Dockerfile.sae}
    cap_add: ["NET_ADMIN"]                 # requis pour créer l'interface wg0
    depends_on:
      pki-init: {condition: service_completed_successfully}
      kme-a: {condition: service_healthy}
    environment:
      KME_URL: https://kme-a:8000
      SAE_ID: SAE_A
      PEER_SAE_ID: SAE_B
      SAE_ROLE: master
      HYBRID: "1"
      CHANNEL_DIR: /shared/chan
      WG_LOCAL_IP: 10.9.0.1/24
      WG_LISTEN_PORT: "51820"
      WG_PEER_ENDPOINT: sae-b:51820
      WG_PEER_ALLOWED_IPS: 10.9.0.2/32
      TLS_CLIENT_CERT: /certs/client.crt
      TLS_CLIENT_KEY: /certs/client.key
      TLS_CA_CERT: /certs/ca.crt
      PQC_CA_PUB: /certs/pqc_ca.pub
      PQC_CERT_DIR: /certs/pqc_public
      PQC_CERT: /certs/pqc_public/sae_a.cert.json
      PQC_PRIV_KEY: /certs/pqc_priv.key
    volumes:
      - shared-data:/shared
      - ./certs/tls/sae_a.crt:/certs/client.crt:ro
      - ./certs/tls/sae_a.key:/certs/client.key:ro
      - ./certs/tls/ca.crt:/certs/ca.crt:ro
      - ./certs/pqc/ca_pub.key:/certs/pqc_ca.pub:ro
      - ./certs/pqc/public:/certs/pqc_public:ro
      - ./certs/pqc/private/sae_a.key:/certs/pqc_priv.key:ro

  sae-b:
    build: {context: ., dockerfile: Dockerfile.sae}
    cap_add: ["NET_ADMIN"]
    depends_on:
      pki-init: {condition: service_completed_successfully}
      kme-b: {condition: service_healthy}
    environment:
      KME_URL: https://kme-b:8000
      SAE_ID: SAE_B
      PEER_SAE_ID: SAE_A
      SAE_ROLE: slave
      HYBRID: "1"
      CHANNEL_DIR: /shared/chan
      WG_LOCAL_IP: 10.9.0.2/24
      WG_LISTEN_PORT: "51820"
      WG_PEER_ENDPOINT: sae-a:51820
      WG_PEER_ALLOWED_IPS: 10.9.0.1/32
      TLS_CLIENT_CERT: /certs/client.crt
      TLS_CLIENT_KEY: /certs/client.key
      TLS_CA_CERT: /certs/ca.crt
      PQC_CA_PUB: /certs/pqc_ca.pub
      PQC_CERT_DIR: /certs/pqc_public
      PQC_CERT: /certs/pqc_public/sae_b.cert.json
      PQC_PRIV_KEY: /certs/pqc_priv.key
    volumes:
      - shared-data:/shared
      - ./certs/tls/sae_b.crt:/certs/client.crt:ro
      - ./certs/tls/sae_b.key:/certs/client.key:ro
      - ./certs/tls/ca.crt:/certs/ca.crt:ro
      - ./certs/pqc/ca_pub.key:/certs/pqc_ca.pub:ro
      - ./certs/pqc/public:/certs/pqc_public:ro
      - ./certs/pqc/private/sae_b.key:/certs/pqc_priv.key:ro

volumes:
  shared-data:
